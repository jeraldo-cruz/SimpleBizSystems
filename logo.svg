<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <g fill="none" stroke="#0d3b66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Central Isometric Cube Top Face -->
    <polygon points="100,68 126,83 100,98 74,83" />
    
    <!-- Central Isometric Cube Left Face -->
    <polygon points="74,83 100,98 100,128 74,113" />
    
    <!-- Central Isometric Cube Right Face -->
    <polygon points="126,83 100,98 100,128 126,113" />
    
    <!-- Mid-Ring Connecting Webs (Connecting Cube to Outer Struts) -->
    <!-- Top Left & Top Right -->
    <line x1="74" y1="83" x2="48" y2="68" />
    <line x1="126" y1="83" x2="152" y2="68" />
    
    <!-- Far Left & Far Right -->
    <line x1="74" y1="113" x2="48" y2="128" />
    <line x1="126" y1="113" x2="152" y2="128" />
    
    <!-- Bottom Left & Bottom Right Webs -->
    <line x1="100" y1="128" x2="100" y2="158" />
    <line x1="100" y1="68" x2="100" y2="38" />

    <!-- Outer Perimeter Framework Lines -->
    <polygon points="100,38 152,68 152,128 100,158 48,128 48,68" />
    
    <!-- 6 Perimeter Hexagon Nodes (Oriented Vertically) -->
    <!-- Top Node -->
    <polygon points="100,14 114,22 114,38 100,46 86,38 86,22" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />
    
    <!-- Top-Right Node -->
    <polygon points="152,44 166,52 166,68 152,76 138,68 138,52" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />
    
    <!-- Bottom-Right Node -->
    <polygon points="152,120 166,128 166,144 152,152 138,144 138,128" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />
    
    <!-- Bottom Node -->
    <polygon points="100,150 114,158 114,174 100,182 86,174 86,158" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />
    
    <!-- Bottom-Left Node -->
    <polygon points="48,120 62,128 62,144 48,152 34,144 34,128" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />
    
    <!-- Top-Left Node -->
    <polygon points="48,44 62,52 62,68 48,76 34,68 34,52" fill="#ffffff" stroke="#0d3b66" stroke-width="6" />

  </g>
</svg>
